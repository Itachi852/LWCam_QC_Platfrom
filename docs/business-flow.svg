<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#046241"/>
    </marker>
    <style>
      .bg { fill: #f5eedb; }
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #133020; }
      .subtitle { font: 500 17px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #466356; }
      .section { fill: #ffffff; stroke: #e4d8b7; stroke-width: 2; rx: 18; }
      .node { fill: #ffffff; stroke: #046241; stroke-width: 2.5; rx: 14; }
      .node-soft { fill: #f9f7f7; stroke: #046241; stroke-width: 2.5; rx: 14; }
      .node-accent { fill: #fff3d9; stroke: #ffb347; stroke-width: 2.5; rx: 14; }
      .node-done { fill: #eaf5ef; stroke: #046241; stroke-width: 2.5; rx: 14; }
      .node-rework { fill: #fff0e0; stroke: #ff9f43; stroke-width: 2.5; rx: 14; }
      .label { font: 700 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #133020; }
      .small { font: 500 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #345244; }
      .tiny { font: 500 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5c7468; }
      .line { fill: none; stroke: #046241; stroke-width: 3; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #8aa598; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .badge { fill: #046241; rx: 11; }
      .badge-text { font: 700 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="980"/>
  <text x="640" y="62" text-anchor="middle" class="title">LWCam 标注任务业务流程</text>
  <text x="640" y="94" text-anchor="middle" class="subtitle">导入任务 → 领取标注 → 提交审核 → QC 通过或驳回返工</text>

  <rect x="58" y="128" width="1164" height="718" class="section"/>

  <!-- Nodes -->
  <rect x="110" y="170" width="230" height="96" class="node-accent"/>
  <text x="225" y="207" text-anchor="middle" class="label">管理员配置</text>
  <text x="225" y="235" text-anchor="middle" class="small">导入路径 + 标注模板</text>

  <rect x="408" y="170" width="230" height="96" class="node-accent"/>
  <text x="523" y="207" text-anchor="middle" class="label">扫描文件夹</text>
  <text x="523" y="235" text-anchor="middle" class="small">每个子文件夹生成任务</text>

  <rect x="706" y="170" width="250" height="96" class="node-soft"/>
  <text x="831" y="202" text-anchor="middle" class="label">导入完成</text>
  <text x="831" y="229" text-anchor="middle" class="small">task.status = indexing</text>
  <text x="831" y="250" text-anchor="middle" class="tiny">images.status = unannotated</text>

  <rect x="706" y="324" width="250" height="104" class="node"/>
  <text x="831" y="361" text-anchor="middle" class="label">标注员领取</text>
  <text x="831" y="388" text-anchor="middle" class="small">assignee_id = 当前标注员</text>
  <text x="831" y="409" text-anchor="middle" class="tiny">images.status = annotating</text>

  <rect x="408" y="324" width="230" height="104" class="node"/>
  <text x="523" y="361" text-anchor="middle" class="label">填写标注项</text>
  <text x="523" y="388" text-anchor="middle" class="small">按任务模板动态渲染</text>
  <text x="523" y="409" text-anchor="middle" class="tiny">例如创建日期、结束日期</text>

  <rect x="110" y="324" width="230" height="104" class="node-soft"/>
  <text x="225" y="361" text-anchor="middle" class="label">保存草稿</text>
  <text x="225" y="388" text-anchor="middle" class="small">保存 annotation_json</text>
  <text x="225" y="409" text-anchor="middle" class="tiny">不进入 QC</text>

  <rect x="408" y="486" width="230" height="104" class="node"/>
  <text x="523" y="523" text-anchor="middle" class="label">提交审核</text>
  <text x="523" y="550" text-anchor="middle" class="small">task.status = pending_review</text>
  <text x="523" y="571" text-anchor="middle" class="tiny">images.status = annotated</text>

  <rect x="706" y="486" width="250" height="104" class="node-accent"/>
  <text x="831" y="523" text-anchor="middle" class="label">QC 审核</text>
  <text x="831" y="550" text-anchor="middle" class="small">查看图片与标注信息</text>
  <text x="831" y="571" text-anchor="middle" class="tiny">任务级通过或驳回</text>

  <rect x="990" y="426" width="190" height="104" class="node-done"/>
  <text x="1085" y="463" text-anchor="middle" class="label">审核通过</text>
  <text x="1085" y="490" text-anchor="middle" class="small">qc_passed</text>
  <text x="1085" y="511" text-anchor="middle" class="tiny">review_completed</text>

  <rect x="990" y="590" width="190" height="104" class="node-rework"/>
  <text x="1085" y="627" text-anchor="middle" class="label">审核驳回</text>
  <text x="1085" y="654" text-anchor="middle" class="small">qc_rejected</text>
  <text x="1085" y="675" text-anchor="middle" class="tiny">task.status = rework</text>

  <rect x="706" y="648" width="250" height="104" class="node-rework"/>
  <text x="831" y="685" text-anchor="middle" class="label">原标注员返工</text>
  <text x="831" y="712" text-anchor="middle" class="small">保留 assignee_id</text>
  <text x="831" y="733" text-anchor="middle" class="tiny">修改后再次提交 QC</text>

  <!-- Lines -->
  <path class="line" d="M 340 218 L 408 218"/>
  <path class="line" d="M 638 218 L 706 218"/>
  <path class="line" d="M 831 266 L 831 324"/>
  <path class="line" d="M 706 376 L 638 376"/>
  <path class="line" d="M 408 376 L 340 376"/>
  <path class="line-soft" d="M 225 428 C 225 462, 350 462, 408 408"/>
  <path class="line" d="M 523 428 L 523 486"/>
  <path class="line" d="M 638 538 L 706 538"/>
  <path class="line" d="M 956 518 C 980 506, 980 486, 990 478"/>
  <path class="line" d="M 956 558 C 980 578, 980 622, 990 642"/>
  <path class="line" d="M 990 642 L 956 700"/>
  <path class="line-soft" d="M 706 700 C 605 700, 523 645, 523 590"/>

  <!-- Display rule box -->
  <rect x="92" y="862" width="1096" height="78" class="node-soft"/>
  <rect x="122" y="883" width="94" height="28" class="badge"/>
  <text x="169" y="902" text-anchor="middle" class="badge-text">显示规则</text>
  <text x="246" y="892" class="small">indexing + assignee_id 为空 = 待领取</text>
  <text x="246" y="918" class="small">indexing + assignee_id 有值 = 待标注 / 标注中</text>
  <text x="690" y="892" class="small">pending_review = 待审核</text>
  <text x="690" y="918" class="small">review_completed = 审核完成，rework = 返工</text>
</svg>
