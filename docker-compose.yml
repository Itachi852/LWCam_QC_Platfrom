services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: LWCam Python Backend
      APP_ENV: docker
      APP_DEBUG: ${APP_DEBUG:-false}
      API_PREFIX: /api
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-lwcam}
      DB_USER: ${DB_USER:-lwcam}
      DB_PASSWORD: ${DB_PASSWORD:-lwcam}
      JWT_SECRET: ${JWT_SECRET:-lwcam-dev-secret-change-in-production-min-32-chars}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      PREVIEW_CACHE_DIR: /app/.cache/previews
      QC_WORK_DIR: /app/.cache/qc_work
      QC_AUDIT_DIR: /app/.cache/qc_audit
      # Must match the volume pair below so paths stored by LWCAM resolve in
      # the backend container.
      CAPTURE_IMAGE_HOST_PATH: ${CAPTURE_IMAGE_HOST_PATH:-./shared-images}
      CAPTURE_IMAGE_CONTAINER_PATH: ${CAPTURE_IMAGE_CONTAINER_PATH:-/data/shared-images}
      # Export writes only container paths. The Windows host directories are
      # supplied through the bind mounts below.
      EXPORT_TEMP_DIR: /data/export-temp
      EXPORT_OUTPUT_DIR: /data/export
      EXPORT_CSV_ENCODING: ${EXPORT_CSV_ENCODING:-utf-8}
      EXPORT_CSV_LINE_ENDING: ${EXPORT_CSV_LINE_ENDING:-CRLF}
      EXPORT_TEMP_RETENTION_HOURS: ${EXPORT_TEMP_RETENTION_HOURS:-24}
    volumes:
      # Keep this host prefix identical to the prefix stored in folder_path.
      - type: bind
        source: ${CAPTURE_IMAGE_HOST_PATH:-./shared-images}
        target: ${CAPTURE_IMAGE_CONTAINER_PATH:-/data/shared-images}
      - type: bind
        source: ${EXPORT_TEMP_HOST_PATH:-E:\\LifeWodd\\ExportTemp}
        target: /data/export-temp
      - type: bind
        source: ${EXPORT_OUTPUT_HOST_PATH:-E:\\LifeWodd\\Export}
        target: /data/export
      - type: volume
        source: lwcam_py_backend_cache
        target: /app/.cache
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5174/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  lwcam_py_backend_cache:

